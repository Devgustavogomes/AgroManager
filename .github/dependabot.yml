version: 2
updates:
  - package-ecosystem: "pnpm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/apps/api"
    target-branch: "develop"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/apps/web"
    target-branch: "develop"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/apps/workers"
    target-branch: "develop"
    schedule:
      interval: "weekly"
